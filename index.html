<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRIMED Verification System</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>

<style>
body{
  font-family:'Inter',sans-serif;
  background:#f4f6f9;
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  width:95%;
  max-width:550px;
  background:#fff;
  padding:25px;
  border-radius:12px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

h1{
  text-align:center;
  font-size:18px;
  margin-bottom:15px;
}

.tabs{
  display:flex;
  border-bottom:1px solid #ddd;
  margin-bottom:15px;
}

.tabs button{
  flex:1;
  padding:10px;
  border:none;
  background:none;
  cursor:pointer;
}

.tabs button.active{
  border-bottom:2px solid black;
  font-weight:600;
}

input{
  width:100%;
  padding:10px;
  margin-bottom:8px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin-bottom:6px;
}

.main{background:black;color:white;}
.sec{background:#ddd;}

#result{margin-top:10px;}

.card{
  border:1px solid #ddd;
  border-left:4px solid green;
  padding:10px;
  border-radius:8px;
  margin-bottom:8px;
}

/* ADMIN */
.admin{
  margin-top:20px;
  padding-top:15px;
  border-top:1px solid #ddd;
}

.admin h2{
  font-size:14px;
  margin-bottom:10px;
}

.list-item{
  font-size:12px;
  border-bottom:1px solid #eee;
  padding:6px 0;
}

.small-btn{
  width:auto;
  padding:4px 6px;
  font-size:11px;
  margin-left:5px;
}
</style>
</head>

<body>

<div class="container">

<h1>PRIMED CERTIFICATE VERIFIER</h1>

<div class="tabs">
  <button class="active" onclick="tab(event,'cert')">CERT</button>
  <button onclick="tab(event,'name')">NAME</button>
</div>

<div id="certTab">
  <input id="certInput" placeholder="Certificate Number">
  <button class="main" onclick="verify()">Verify</button>
  <button class="sec" onclick="scanQR()">Scan QR</button>
</div>

<div id="nameTab" style="display:none;">
  <input id="nameInput" placeholder="Search Name">
  <button class="main" onclick="search()">Search</button>
</div>

<div id="scanner" style="display:none;">
  <video id="video" autoplay></video>
  <canvas id="canvas" hidden></canvas>
</div>

<div id="result"></div>

<!-- ADMIN PANEL -->
<div class="admin">
<h2>ADMIN PANEL</h2>

<input id="aName" placeholder="Name">
<input id="aCert" placeholder="Certificate Number">
<input id="aTrain" placeholder="Training">
<input id="aDate" placeholder="Date">

<button class="main" onclick="add()">Add Trainee</button>

<div id="list"></div>
</div>

</div>

<audio id="beep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>
const beep=document.getElementById("beep");

/* 🔥 FULL DATA (PABABA / VERTICAL) */
let certData = JSON.parse(localStorage.getItem("certData")) || [

{ "Name":"Willzen A. Ballen",
  "Certificate Number":"PRIMED-STB-20251101-001",
  "Training":"STOP THE BLEED",
  "Date":"11-01-2025"
},
{ "Name":"Howie Jay Carillo",
 "Certificate Number":"PRIMED-STB-20251101-002",
 "Training":"STOP THE BLEED","Date":"11-01-2025"
},
{ "Name":"Akio T. Azuelo",
 "Certificate Number":"PRIMED-STB-20251101-003",
 "Training":"STOP THE BLEED",
 "Date":"11-01-2025"
},
{ "Name":"Cyrus John V. Tamayosa",
 "Certificate Number":"PRIMED-STB-20251101-004",
 "Training":"STOP THE BLEED",
 "Date":"11-01-2025"
},
{ "Name":"Ramdel L. Antonio",
 "Certificate Number":"PRIMED-STB-20251101-005",
 "Training":"STOP THE BLEED",
 "Date":"11-01-2025" },
{ "Name":"Mark Andie B. Natividad",
 "Certificate Number":"PRIMED-STB-20251101-006",
 "Training":"STOP THE BLEED",
 "Date":"11-01-2025"
},
{ "Name":"Jerald R. Garcia",
 "Certificate Number":"PRIMED-STB-20251211-001",
 "Training":"STOP THE BLEED",
 "Date":"12-11-2025"
},
{ "Name":"Leon Zachary Seth D. Santos",
 "Certificate Number":"PRIMED-DRRM-20251227-001",
 "Training":"Intro to DRRM",
 "Date":"12-27-2025"
}

];

/* SAVE */
function save(){
  localStorage.setItem("certData",JSON.stringify(certData));
}

/* TAB */
function tab(e,t){
  document.getElementById("certTab").style.display=t=="cert"?"block":"none";
  document.getElementById("nameTab").style.display=t=="name"?"block":"none";
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  e.target.classList.add("active");
}

/* VERIFY */
function verify(){
  let val=document.getElementById("certInput").value.toUpperCase().trim();
  let f=certData.find(r=>r["Certificate Number"].toUpperCase()==val);

  if(!f){
    document.getElementById("result").innerHTML="NOT FOUND ❌";
    beep.play();return;
  }
  show([f]);
}

/* SEARCH */
function search(){
  let name=document.getElementById("nameInput").value.toUpperCase();
  let res=certData.filter(r=>r.Name.toUpperCase().includes(name));

  if(res.length==0){
    document.getElementById("result").innerHTML="NO RESULT ❌";
    beep.play();return;
  }
  show(res);
}

/* SHOW */
function show(list){
  let html="VERIFIED ✅<br><br>";
  list.forEach(r=>{
    html+=`
    <div class="card">
    <b>${r.Name}</b><br>
    ${r["Certificate Number"]}<br>
    ${r.Training}<br>
    ${r.Date}
    </div>`;
  });
  document.getElementById("result").innerHTML=html;
  beep.play();
}

/* ADMIN ADD */
function add(){
  let n=document.getElementById("aName").value;
  let c=document.getElementById("aCert").value;
  let t=document.getElementById("aTrain").value;
  let d=document.getElementById("aDate").value;

  certData.push({Name:n,"Certificate Number":c,Training:t,Date:d});
  save();
  renderList();
}

/* DELETE */
function del(i){
  certData.splice(i,1);
  save();
  renderList();
}

/* EDIT */
function edit(i){
  let r=certData[i];
  document.getElementById("aName").value=r.Name;
  document.getElementById("aCert").value=r["Certificate Number"];
  document.getElementById("aTrain").value=r.Training;
  document.getElementById("aDate").value=r.Date;

  del(i);
}

/* LIST */
function renderList(){
  let html="";
  certData.forEach((r,i)=>{
    html+=`
    <div class="list-item">
    ${r.Name}
    <button class="small-btn" onclick="edit(${i})">Edit</button>
    <button class="small-btn" onclick="del(${i})">X</button>
    </div>`;
  });
  document.getElementById("list").innerHTML=html;
}

renderList();

/* QR */
let stream=null;
function scanQR(){
  const v=document.getElementById("video");
  const s=document.getElementById("scanner");

  navigator.mediaDevices.getUserMedia({video:true}).then(st=>{
    stream=st;
    v.srcObject=st;
    s.style.display="block";
    v.onloadedmetadata=()=>loop();
  });
}

function loop(){
  const v=document.getElementById("video");
  const c=document.getElementById("canvas");
  const ctx=c.getContext("2d");

  c.width=v.videoWidth;
  c.height=v.videoHeight;
  ctx.drawImage(v,0,0);

  let img=ctx.getImageData(0,0,c.width,c.height);
  let qr=jsQR(img.data,c.width,c.height);

  if(qr){
    document.getElementById("certInput").value=qr.data;
    verify();
    stream.getTracks().forEach(t=>t.stop());
    document.getElementById("scanner").style.display="none";
    return;
  }
  requestAnimationFrame(loop);
}
</script>

</body>
</html>
